services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hermes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hermes}
      POSTGRES_DB: ${POSTGRES_DB:-hermes}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - hermes_pgdata:/var/lib/postgresql/data
    networks:
      - hermes
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hermes}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7
    container_name: hermes-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - hermes_redisdata:/data
    networks:
      - hermes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hermes-api
    ports:
      - "3001:3001"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hermes}:${POSTGRES_PASSWORD:-hermes}@postgres:5432/${POSTGRES_DB:-hermes}?schema=public&connection_limit=10&pool_timeout=20
      - REDIS_URL=redis://redis:6379
      - WA_SESSION_DIR=/app/data/wa-sessions
      - WA_MEDIA_DIR=/app/data/wa-media
      # Encrypts external product-source credentials (DB connection strings,
      # Google service-account keys) at rest. Set a strong random value in prod.
      - SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-}
      # Minutes between automatic product-stock re-syncs (0/unset = manual only).
      - PRODUCT_AUTOSYNC_MINUTES=${PRODUCT_AUTOSYNC_MINUTES:-}
    volumes:
      - hermes_sessions:/app/data/wa-sessions
      - hermes_media:/app/data/wa-media
    networks:
      - hermes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const h=require('http');h.get('http://localhost:3001/api/v1/health',r=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hermes-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://localhost:3001}
    networks:
      - hermes
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  waha:
    image: devlikeapro/waha:latest
    container_name: hermes-waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - WAHA_ENGINE=${WAHA_ENGINE:-NOWEB}
      - WHATSAPP_API_KEY=${WAHA_API_KEY:-changeme}
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - hermes
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: hermes-nginx
    profiles:
      - nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - hermes
    depends_on:
      - api
      - web
    restart: unless-stopped

networks:
  hermes:
    driver: bridge

volumes:
  hermes_pgdata:
  hermes_redisdata:
  hermes_sessions:
  hermes_media:
  waha_sessions:
