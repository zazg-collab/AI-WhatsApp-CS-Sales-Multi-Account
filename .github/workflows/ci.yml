name: CI

on:
  push:
    branches: [master, main, 'claude/**', 'feat/**', 'fix/**', 'chore/**', 'perf/**']
  pull_request:
    branches: [master, main]

# Cancel superseded runs on the same ref so a rapid series of pushes doesn't pile
# up redundant CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint API
        run: npm run lint --workspace=@sentinel/api

      - name: Lint Web
        run: npm run lint --workspace=@sentinel/web

      - name: Build API
        run: npm run build --workspace=@sentinel/api

      - name: Build Web
        run: npm run build --workspace=@sentinel/web

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: TypeScript check (API)
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: TypeScript check (Web)
        run: npx tsc --noEmit
        working-directory: apps/web

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Source-level hardening guard (env template, security middleware, validation
      # pipe, shutdown hooks, readiness endpoint). It existed but gated nothing.
      - name: QA hardening checks
        run: npm test

      - name: API unit tests
        run: npm run test --workspace=@sentinel/api

      - name: API e2e tests (security wiring)
        run: npm run test:e2e --workspace=@sentinel/api

      - name: Web tests
        run: npm run test --workspace=@sentinel/web

  migrations:
    name: Prisma Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector/pgvector ships the `vector` extension on top of stock
        # Postgres 16 — migration 20_knowledge_embeddings needs `CREATE
        # EXTENSION vector`, which plain postgres:16 doesn't have installed.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hermes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hermes
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      # Applies every committed migration to a fresh database. Catches the
      # "migration won't deploy" class of bug that unit tests (Prisma mocked)
      # can't see.
      - name: Apply migrations to a fresh database
        run: npm run migrate:deploy --workspace=@sentinel/database

      # Fails if the schema and the applied migrations have drifted apart
      # (a migration is missing for a schema change). Blocking: this exact
      # gap shipped once (customer opt-out columns without a migration).
      #
      # One expected, permanent exception: knowledge_items.embedding is a
      # `vector` column declared as Prisma `Unsupported(...)`, so its HNSW
      # index (created directly in migration 20_knowledge_embeddings, since
      # Prisma 5 can't express vector index ops in schema.prisma) will always
      # show as "drift" here. Allow only that one line through; fail on
      # anything else.
      - name: Verify schema matches migrations (no drift)
        run: |
          diff_output=$(npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma || true)
          echo "$diff_output"
          unexpected=$(echo "$diff_output" | sed -E 's/^[[:space:]]+//' \
            | grep -E '^\[[*+-]\]' \
            | grep -v -E '^\[\*\] Changed the `knowledge_items` table$' \
            | grep -v -E '^\[-\] Removed index on columns \(embedding\)$' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected schema drift detected (beyond the known knowledge_items.embedding index gap):"
            echo "$unexpected"
            exit 1
          fi
        working-directory: packages/database

      # Real-DB integration tests (account-scope isolation). These mock nothing
      # at the data layer — the one place a tenant-isolation leak would hide.
      # Skipped automatically when DATABASE_URL is unset (e.g. local runs).
      - name: Account-scope isolation tests (real Postgres)
        run: npm run test:int --workspace=@sentinel/api
