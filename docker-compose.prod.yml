# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file overrides restart policies, enables Redis password + persistence,
# adds the Nginx reverse proxy with SSL, and wires NODE_ENV=production everywhere.

services:
  postgres:
    restart: always
    ports: []
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    restart: always
    ports: []
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispass}
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    restart: always
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 2G

  web:
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://YOUR_SERVER_IP/api/v1}
      - NEXT_PUBLIC_SOCKET_URL=${NEXT_PUBLIC_SOCKET_URL:-http://YOUR_SERVER_IP}
    deploy:
      resources:
        limits:
          memory: 1G

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    restart: always

volumes:
  certbot_certs:
  certbot_www:
