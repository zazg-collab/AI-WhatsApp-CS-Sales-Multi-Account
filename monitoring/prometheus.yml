global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: hermes-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ['api:3001']
    # If METRICS_TOKEN is set on the API, uncomment and set the same value here:
    # authorization:
    #   credentials: ${METRICS_TOKEN}
