global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 30m
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 15m

receivers:
  - name: default
    webhook_configs:
      - url: 'http://api:3001/api/v1/internal/alerts'
        send_resolved: true
        http_config:
          authorization:
            credentials: ${ALERTMANAGER_WEBHOOK_TOKEN}
  - name: critical
    webhook_configs:
      - url: 'http://api:3001/api/v1/internal/alerts'
        send_resolved: true
        http_config:
          authorization:
            credentials: ${ALERTMANAGER_WEBHOOK_TOKEN}
